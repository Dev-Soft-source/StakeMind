[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"scripts/*.py" = ["E402"]
"app/api/v1/premium.py" = ["E501"]
"app/api/v1/entitlements.py" = ["E501"]
"app/services/premium/alerts.py" = ["E501"]
"app/api/v1/automation.py" = ["E501"]
"app/api/v1/schemas/automation.py" = ["E501"]
"app/services/automation/handlers.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
